<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="imx-token" content="__IMX_TOKEN__">
  <title>iMessage Explorer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>iMessage Explorer</h1>
      <p id="summary" class="muted">Loading your messages…</p>
    </div>
    <div class="top-actions">
      <button id="update" type="button">Update messages</button>
      <p class="privacy">Runs only on this Mac. Nothing leaves it unless you confirm an AI request.</p>
    </div>
  </header>

  <nav class="tabs" id="nav" aria-label="Sections"></nav>
  <div class="subnav" id="subnav" aria-label="Screens in this section"></div>

  <section class="filters" id="filters" aria-label="Filters for this screen">
    <label>Person or group
      <input id="f-contact" list="contact-list" placeholder="Everyone" autocomplete="off">
      <datalist id="contact-list"></datalist>
    </label>
    <label>From <input id="f-from" type="date"></label>
    <label>To <input id="f-to" type="date"></label>
    <label>Direction
      <select id="f-direction">
        <option value="">Sent and received</option>
        <option value="sent">Sent by me</option>
        <option value="received">Received</option>
      </select>
    </label>
    <label>Chats
      <select id="f-scope">
        <option value="">Direct and group</option>
        <option value="direct">Direct only</option>
        <option value="group">Group only</option>
      </select>
    </label>
    <label class="check"><input id="f-junk" type="checkbox"> Include automated senders</label>
    <button id="f-clear" type="button" class="quiet">Clear filters</button>
  </section>

  <main id="view" aria-live="polite"></main>

  <script src="/app.js"></script>
</body>
</html>
